name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: place-pace

env:
  IMAGE_PREFIX: ghcr.io/slava-kalinichev/place-pace

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            place-pace/requirements.txt
            place-pace/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: place-pace/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Поднять стек без ключей и переводчика
        run: docker compose up -d --build --wait --wait-timeout 300 db backend frontend
      - name: API отвечает через фронтенд
        run: curl -fsS http://localhost:8080/api/health
      - name: Фронтенд отдаёт приложение
        run: curl -fsS http://localhost:8080/ | grep -q 'id="root"'
      - name: Каталог мест загружается
        run: |
          docker compose run --rm seed
          curl -fsS http://localhost:8080/api/places | python3 -c "import json,sys; assert json.load(sys.stdin)"
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Остановить стек
        if: always()
        run: docker compose down -v

  images:
    needs: compose-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: deploy/frontend/Dockerfile
          - name: translator
            dockerfile: translator/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: place-pace
          file: place-pace/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.name == 'frontend' && format('VITE_YANDEX_MAPS_API_KEY={0}', secrets.VITE_YANDEX_MAPS_API_KEY) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
