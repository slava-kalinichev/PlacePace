# Прод-оверлей поверх docker-compose.yml:
#   docker compose --profile routing --env-file .env.production.backend \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  otp:
    command: ["--load"]

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}

  translator:
    mem_limit: 1300m
    memswap_limit: 1300m

  # На проде фронтенд отдаёт nginx на хосте, каталог мест уже загружен
  frontend:
    profiles: [dev-only]

  seed:
    profiles: [dev-only]

  backend:
    env_file:
      - .env.production.backend
    depends_on:
      - osrm
      - otp
      - translator
